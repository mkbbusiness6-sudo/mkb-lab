name: Deploy mkbLab Application

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:

  # ============================================================
  # CI - Vérification du projet
  # ============================================================
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # 1. Récupération du code
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Installation PHP
      # --------------------------------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, pgsql, pdo_pgsql, redis
          coverage: none

      # --------------------------------------------------------
      # 3. Vérification Composer
      # --------------------------------------------------------
      - name: Validate Composer
        run: composer validate --strict

      # --------------------------------------------------------
      # 4. Installation des dépendances PHP
      # --------------------------------------------------------
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # --------------------------------------------------------
      # 5. Vérification Laravel
      # --------------------------------------------------------
      - name: Check Laravel
        run: php artisan --version

      # --------------------------------------------------------
      # 6. Tests Laravel
      # --------------------------------------------------------
      - name: Run Laravel tests
        run: php artisan test

      # --------------------------------------------------------
      # 7. Installation Node.js
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # --------------------------------------------------------
      # 8. Installation dépendances JavaScript
      # --------------------------------------------------------
      - name: Install frontend dependencies
        run: npm ci

      # --------------------------------------------------------
      # 9. Compilation frontend
      # --------------------------------------------------------
      - name: Build frontend
        run: npm run build


  # ============================================================
  # CD - Déploiement sur le VPS
  # ============================================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    needs:
      - ci

    steps:

      # --------------------------------------------------------
      # 1. Connexion SSH et déploiement
      # --------------------------------------------------------
      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |

            echo "=========================================="
            echo "Starting Laravel deployment"
            echo "=========================================="

            cd /var/www/mkb-lab

            echo "1. Updating source code..."
            git fetch origin main
            git reset --hard origin/main

            echo "2. Installing PHP dependencies..."
            composer install \
              --no-dev \
              --no-interaction \
              --prefer-dist \
              --optimize-autoloader

            echo "3. Installing frontend dependencies..."
            npm ci

            echo "4. Building frontend..."
            npm run build

            echo "5. Running database migrations..."
            php artisan migrate --force

            echo "6. Clearing Laravel caches..."
            php artisan optimize:clear

            echo "7. Rebuilding Laravel caches..."
            php artisan optimize

            echo "=========================================="
            echo "Deployment completed successfully"
            echo "=========================================="