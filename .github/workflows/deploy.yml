name: MKB Lab Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  APP_PATH: /var/www/mkb-lab

jobs:
  ci:
    name: CI / Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, pgsql, pdo_pgsql, redis
          coverage: none

      - name: Validate Composer
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Check Laravel
        run: php artisan --version

      - name: Run Laravel tests
        run: php artisan test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs:
      - ci

    steps:
      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_REF: ${{ github.ref_name }}
          APP_PATH: /var/www/mkb-lab
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_SHA,DEPLOY_REF,APP_PATH
          script: |
            set -e

            echo "=========================================="
            echo "MKB LAB - PRODUCTION DEPLOYMENT"
            echo "=========================================="

            echo "Commit: ${DEPLOY_SHA}"
            echo "Branch: ${DEPLOY_REF}"
            echo "Application: ${APP_PATH}"

            mkdir -p "${APP_PATH}/releases"
            mkdir -p "${APP_PATH}/shared"
            mkdir -p "${APP_PATH}/shared/storage"
            mkdir -p "${APP_PATH}/shared/storage/app/public"
            mkdir -p "${APP_PATH}/shared/storage/framework/cache/data"
            mkdir -p "${APP_PATH}/shared/storage/framework/sessions"
            mkdir -p "${APP_PATH}/shared/storage/framework/testing"
            mkdir -p "${APP_PATH}/shared/storage/framework/views"
            mkdir -p "${APP_PATH}/shared/storage/logs"

            RELEASE_ID="$(date +%Y%m%d_%H%M%S)_$(echo "${DEPLOY_SHA}" | cut -c1-7)"
            RELEASE_PATH="${APP_PATH}/releases/${RELEASE_ID}"

            echo "Release: ${RELEASE_ID}"

            git clone --no-checkout --filter=blob:none git@github.com:mkbbusiness6-sudo/mkb-lab.git "${RELEASE_PATH}"

            cd "${RELEASE_PATH}"

            git fetch origin "${DEPLOY_SHA}"
            git checkout --detach "${DEPLOY_SHA}"

            echo "Deployed commit:"
            git rev-parse HEAD

            if [ ! -f "${APP_PATH}/shared/.env" ]; then
              echo "ERROR: Production .env does not exist."
              exit 1
            fi

            ln -sfn "${APP_PATH}/shared/.env" "${RELEASE_PATH}/.env"

            rm -rf "${RELEASE_PATH}/storage"

            ln -sfn "${APP_PATH}/shared/storage" "${RELEASE_PATH}/storage"

            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            npm ci

            npm run build

            if [ ! -f "${RELEASE_PATH}/public/build/manifest.json" ]; then
              echo "ERROR: Vite manifest was not generated."
              exit 1
            fi

            php artisan storage:link

            php artisan optimize:clear

            php artisan migrate --force

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            sudo chown -R deploy:www-data "${RELEASE_PATH}/bootstrap/cache"
            sudo chown -R deploy:www-data "${APP_PATH}/shared/storage"

            sudo find "${APP_PATH}/shared/storage" -type d -exec chmod 775 {} \;
            sudo find "${APP_PATH}/shared/storage" -type f -exec chmod 664 {} \;
            sudo find "${RELEASE_PATH}/bootstrap/cache" -type d -exec chmod 775 {} \;
            sudo find "${RELEASE_PATH}/bootstrap/cache" -type f -exec chmod 664 {} \;

            rm -rf "${RELEASE_PATH}/node_modules"

            ln -sfn "${RELEASE_PATH}" "${APP_PATH}/current"

            sudo systemctl reload php8.5-fpm
            sudo nginx -t
            sudo systemctl reload nginx

            echo "Checking production application health..."

            curl -fsS "https://mkb-lab.tech/up" > /dev/null

            echo "Health check: OK"

            echo "=========================================="
            echo "ACTIVE RELEASE"
            echo "=========================================="

            readlink -f "${APP_PATH}/current"

            echo "=========================================="
            echo "ACTIVE COMMIT"
            echo "=========================================="

            git -C "${APP_PATH}/current" rev-parse HEAD

            echo "=========================================="
            echo "EXPECTED COMMIT"
            echo "=========================================="

            echo "${DEPLOY_SHA}"

            echo "=========================================="
            echo "PRODUCTION DEPLOYMENT SUCCESSFUL"
            echo "=========================================="

            cd "${APP_PATH}/releases"

            ls -1dt */ 2>/dev/null | tail -n +6 | xargs -r rm -rf
